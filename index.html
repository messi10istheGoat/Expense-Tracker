<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spendwise — a calmer way to track expenses, plan your budget, and make room for what matters."
    />
    <meta name="theme-color" content="#f7f9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14241e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Spendwise — Personal Finance Dashboard</title>
    <script>
      // Match the appearance provider before first paint, including legacy users.
      (function () {
        var mode = 'system',
          style = 'minimal',
          textSize = 'standard';
        try {
          var savedMode = localStorage.getItem('spendwise-theme');
          var savedStyle = localStorage.getItem('spendwise-style');
          if (savedMode === 'light' || savedMode === 'dark') {
            mode = savedMode;
            style = 'botanical';
          }
          if (['minimal', 'botanical', 'brutalist', 'neon'].indexOf(savedStyle) !== -1) style = savedStyle;
          if (localStorage.getItem('spendwise-text-size') === 'large') textSize = 'large';
        } catch (e) {}
        var dark =
          mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.dataset.style = style;
        root.dataset.textSize = textSize;
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
