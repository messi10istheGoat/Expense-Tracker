project_id = "spendwise"
[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "spendwise://auth-callback"]
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
[functions.delete-account]
